apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: axion
spec:
  replicas: 1

  selector:
    matchLabels:
      app: pgadmin

  template:
    metadata:
      labels:
        app: pgadmin

    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@example.com

            - name: PGADMIN_DEFAULT_PASSWORD
              value: "Admin12345!"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"

            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: axion

spec:
  selector:
    app: pgadmin

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

  type: ClusterIP